[server]
# Enable CORS for production
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

# Run in headless mode for cloud deployment
headless = true

[browser]
# Disable gather usage stats
gatherUsageStats = false

[theme]
# Default theme settings (user can toggle dark mode)
base = "light"
primaryColor = "#1f77b4"

[client]
# Show error details in production (set to false for user-facing)
showErrorDetails = true
toolbarMode = "minimal"

[runner]
# Fast reruns for better UX
fastReruns = true
